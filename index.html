<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <aside class="sidebar">
        <div class="brand">
            <img src="https://cdn-icons-png.flaticon.com/512/3135/3135706.png" alt="SpendWise logo" width="34">
            <span>SpendWise</span>
        </div>
        <nav>
            <button class="nav-btn active" data-page="dashboard">📊 Dashboard</button>
            <button class="nav-btn" data-page="expenses">💸 Expenses</button>
            <button class="nav-btn" data-page="savings">🐖 Savings</button>
            <button class="nav-btn" data-page="budget">🎯 Budget</button>
        </nav>
    </aside>

    <main>
        <!-- DASHBOARD -->
        <section id="dashboard" class="page active">
            <h1>Dashboard</h1>
            <div class="cards">
                <div class="card stat"><h3>Budget</h3><p id="d-budget">KSh 0</p></div>
                <div class="card stat"><h3>Spent</h3><p id="d-spent">KSh 0</p></div>
                <div class="card stat"><h3>Remaining</h3><p id="d-remaining">KSh 0</p></div>
                <div class="card stat"><h3>Saved</h3><p id="d-saved">KSh 0</p></div>
            </div>
            <div class="card">
                <h2>Budget used</h2>
                <div class="bar"><div id="d-bar" class="fill"></div></div>
                <p id="d-status" class="status"></p>
            </div>
            <div class="two-col">
                <div class="card"><h2>Spending by category</h2><div id="d-cats"></div></div>
                <div class="card"><h2>Recent expenses</h2><ul id="d-recent" class="plain"></ul></div>
            </div>
        </section>

        <!-- EXPENSES -->
        <section id="expenses" class="page">
            <h1>Expenses</h1>
            <div class="card">
                <h2>Add expense</h2>
                <div class="form-grid">
                    <div><label for="e-name">Name</label><input type="text" id="e-name" placeholder="e.g. Groceries"></div>
                    <div><label for="e-amount">Amount (KSh)</label><input type="number" id="e-amount" placeholder="0"></div>
                    <div><label for="e-category">Category</label><select id="e-category"></select></div>
                    <div><label for="e-date">Date</label><input type="date" id="e-date"></div>
                </div>
                <button type="button" id="e-add">Add expense</button>
                <p id="e-msg" class="msg"></p>
            </div>
            <div class="card">
                <div class="card-head">
                    <h2>All expenses</h2>
                    <select id="e-filter" aria-label="Filter by category"></select>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>Name</th><th>Amount</th><th>Category</th><th>Date</th><th></th></tr></thead>
                        <tbody id="e-body"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- SAVINGS -->
        <section id="savings" class="page">
            <h1>Savings</h1>
            <div class="card">
                <h2>New savings goal</h2>
                <div class="form-grid">
                    <div><label for="g-name">Goal</label><input type="text" id="g-name" placeholder="e.g. Laptop"></div>
                    <div><label for="g-target">Target (KSh)</label><input type="number" id="g-target" placeholder="0"></div>
                </div>
                <button type="button" id="g-add">Create goal</button>
                <p id="g-msg" class="msg"></p>
            </div>
            <div id="g-list"></div>
        </section>

        <!-- BUDGET -->
        <section id="budget" class="page">
            <h1>Budget</h1>
            <div class="card narrow">
                <h2>Monthly budget</h2>
                <label for="b-input">Amount (KSh)</label>
                <input type="number" id="b-input" placeholder="0">
                <button type="button" id="b-save">Save budget</button>
                <p id="b-msg" class="msg"></p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
